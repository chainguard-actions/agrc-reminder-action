name: Test default inputs usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run reminder action with only required token (other inputs use defaults)
        id: action
        uses: .
        with:
          repoToken: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with default inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with default inputs, outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome (expected success or failure, got): $OUTCOME"
            exit 1
          fi
