name: Test default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_REPOSITORY_OWNER: test-owner
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run issue reminder action with default-like inputs
        id: action
        uses: .
        with:
          repoToken: fake-token-for-testing
          repository: ${{ env.GITHUB_REPOSITORY }}
          repositoryOwner: ${{ env.GITHUB_REPOSITORY_OWNER }}
        continue-on-error: true
      - name: Assert action ran with default-like inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with default-like inputs (outcome=$OUTCOME)"
