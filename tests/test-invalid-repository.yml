name: Test repository input parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run reminder action with explicit owner and repo
        id: action
        uses: .
        with:
          repoToken: ${{ github.token }}
          repository: ${{ github.repository }}
          repositoryOwner: ${{ github.repository_owner }}
        continue-on-error: true
      - name: Assert action ran and produced a deterministic outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
